<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listen — Artist Landing Page Template</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            color: white;

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .language-toggle {
            position: fixed;
            top: 15px; left: 15px;
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.9rem;
            z-index: 1000;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        .language-toggle:hover { background: rgba(255,255,255,0.3); }

        .player-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .back-button {
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .back-button:hover { background: #c62828; transform: translateX(-5px); }
        .player-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
        }

        .player-section {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            margin: 1rem 0 2rem;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .player-logo { text-align: center; margin-bottom: 2rem; }
        .player-logo img {
            max-width: 200px;
            border-radius: 50%;
            border: 3px solid #c62828;
            padding: 5px;
            background: rgba(255,255,255,0.1);
        }
        .audio-player-container { max-width: 600px; margin: 0 auto; }
        .now-playing { text-align: center; margin-bottom: 2rem; }
        .track-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        .track-artist { font-size: 1.1rem; color: #c62828; margin-bottom: 1rem; }

        .custom-audio-player {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .progress-container {
            width: 100%; height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            margin-bottom: 1rem;
            cursor: pointer;
            position: relative;
        }
        .progress-bar { height: 100%; background: #c62828; border-radius: 3px; width: 0%; }
        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 1rem;
        }
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 1rem;
        }
        .control-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            width: 50px; height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        .control-btn:hover { background: rgba(198,40,40,0.3); transform: scale(1.1); }
        .control-btn.play-pause { background: #c62828; width: 60px; height: 60px; font-size: 1.8rem; }
        .control-btn.play-pause:hover { background: #d32f2f; }

        .volume-control { display: flex; align-items: center; gap: 0.5rem; margin-top: 1rem; }
        .volume-control i { color: rgba(255,255,255,0.7); font-size: 1.1rem; }
        .volume-slider {
            flex: 1; height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }
        .volume-level { height: 100%; background: #c62828; border-radius: 2px; width: 80%; }
        input[type="range"] {
            width: 100%; height: 4px;
            -webkit-appearance: none;
            background: transparent;
            position: absolute; top: 0; left: 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px; height: 12px;
            background: white;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #c62828;
        }

        .playlist { background: rgba(0,0,0,0.3); border-radius: 10px; overflow: hidden; }
        .playlist-title {
            padding: 1rem;
            font-size: 1.2rem;
            font-weight: 600;
            background: rgba(198,40,40,0.3);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .playlist-items { list-style: none; }
        .playlist-item {
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: all 0.3s ease;
        }
        .playlist-item:hover { background: rgba(198,40,40,0.2); }
